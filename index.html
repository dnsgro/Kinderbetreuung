  // ---- Schichtplan bearbeiten ----
  function validateDraft(dr) {
    if (dr.from !== null && !isValidDate(dr.from)) return 'Bitte ein gültiges Startdatum wählen.';
    for (const k of PLAN_KEYS) {
      const list = dr.days[k];
      for (const sh of list) {
        if (!isTime(sh.s) || !isTime(sh.e)) return `${PLAN_LABELS[k]}: Bitte Beginn und Ende ausfüllen.`;
        if (toMin(sh.e) <= toMin(sh.s)) return `${PLAN_LABELS[k]}: Das Ende muss nach dem Beginn liegen.`;
      }
      const sorted = list.slice().sort(byStart);
      for (let i = 1; i < sorted.length; i++) if (toMin(sorted[i].s) < toMin(sorted[i - 1].e)) return `${PLAN_LABELS[k]}: Schichten dürfen sich nicht überschneiden.`;
    }
    if (dr.from !== null && data.plans.some((p, i) => i !== dr.idx && p.from === dr.from)) return `Für den ${fmtDate(dr.from)} gibt es schon eine Planänderung.`;
    return '';
  }
  function rerenderPlan() { const s = $('#secPlan'); if (s) s.innerHTML = planEditorHTML(sheetCtx.draft); }
  function updatePlanControls() {
    const dr = sheetCtx.draft;
    const err = $('#peError');
    if (err) { err.textContent = dr.error; err.hidden = !dr.error; }
    $$('[data-act="pe-save"], [data-act="pe-discard"]').forEach((b) => { b.disabled = !dr.dirty; });
  }
  function onPlanInput(t) {
    if (!sheetCtx || sheetCtx.type !== 'settings') return;
    const dr = sheetCtx.draft;
    const pd = t.dataset.pd;
    if (pd === 's' || pd === 'e') {
      const sh = dr.days[t.dataset.k] && dr.days[t.dataset.k][+t.dataset.j];
      if (!sh || sh[pd] === t.value) return;
      sh[pd] = t.value;
    } else if (pd === 'from') {
      if (dr.from === t.value) return;
      dr.from = t.value;
    } else return;
    dr.dirty = true;
    dr.error = validateDraft(dr);
    updatePlanControls();
  }
  async function onVersionChange(sel) {
    const dr = sheetCtx.draft;
    const idx = +sel.value;
    if (idx === dr.idx) return;
    if (dr.dirty && !(await confirmDiscard())) { sel.value = String(dr.idx); return; }
    sheetCtx.draft = idx === -1 ? dr : makeDraft(idx);
    rerenderPlan();
  }
  function planAdd(k) {
    const dr = sheetCtx.draft;
    const list = dr.days[k];
    const last = list.slice().sort(byStart).pop();
    let s = last && isTime(last.e) ? toMin(last.e) + 60 : 9 * 60;
    let e = s + 180;
    if (e > 23 * 60 + 59) { s = 9 * 60; e = 12 * 60; }
    list.push({ s: fromMin(s), e: fromMin(e) });
    dr.dirty = true;
    dr.error = validateDraft(dr);
    rerenderPlan();
  }
  function planDel(k, j) {
    const dr = sheetCtx.draft;
    dr.days[k].splice(j, 1);
    dr.dirty = true;
    dr.error = validateDraft(dr);
    rerenderPlan();
  }
  function planDefaults() {
    const dr = sheetCtx.draft;
    dr.days = defaultPlanDays();
    dr.dirty = true;
    dr.error = validateDraft(dr);
    rerenderPlan();
  }
  function planDiscard() {
    const dr = sheetCtx.draft;
    sheetCtx.draft = makeDraft(dr.idx === -1 ? currentPlanIdx() : dr.idx);
    rerenderPlan();
  }
  async function planNew() {
    const dr = sheetCtx.draft;
    if (dr.dirty && !(await confirmDiscard())) return;
    let from = firstOfNextMonth(today);
    while (data.plans.some((p) => p.from === from)) from = addDays(from, 1);
    sheetCtx.draft = { idx: -1, from, days: clone(planFor(from).days), dirty: true, error: '' };
    rerenderPlan();
    toast('Startdatum und Zeiten anpassen, dann „Plan speichern“.');
  }
  // Gewählte Schichten, deren Zeiten nicht (mehr) zum Plan ihres Tages passen
  function mismatched() {
    const out = new Map();
    for (const date of Object.keys(data.shifts)) {
      const slots = slotsFor(date);
      for (const x of data.shifts[date]) if (!matchesPlan(x, slots)) out.set(x.id, date);
    }
    return out;
  }
  async function offerAdapt(before) {
    const fresh = [...mismatched()].filter(([id]) => !before.has(id));
    if (!fresh.length) return;
    const past = fresh.filter(([, d]) => d < today).length;
    const choice = await ask({
      title: 'Gewählte Schichten anpassen?',
      html: `${fresh.length === 1 ? 'Eine gewählte Schicht hat' : `<b>${fresh.length}</b> gewählte Schichten haben`} andere Zeiten als der geänderte Plan${past ? ` (davon ${past} in der Vergangenheit)` : ''}.<br><br>„Anpassen“ übernimmt die neuen Zeiten. Sonst bleiben die gespeicherten Zeiten erhalten und werden gestrichelt markiert.`,
      buttons: [{ label: 'Unverändert lassen', value: false }, { label: 'Anpassen', value: true, style: 'primary' }],
    });
    if (!choice) return;
    let changed = 0, wasExported = 0;
    const byDate = new Map();
    for (const [id, d] of fresh) { if (!byDate.has(d)) byDate.set(d, []); byDate.get(d).push(id); }
    for (const [date, ids] of byDate) {
      const slots = slotsFor(date);
      const list = selsOf(date);
      const taken = new Set(list.filter((x) => matchesPlan(x, slots)).map((x) => `${x.s}-${x.e}`));
      for (const id of ids) {
        const x = list.find((v) => v.id === id);
        if (!x) continue;
        let best = null, bestOv = 0;
        for (const sl of slots) {
          if (taken.has(`${sl.s}-${sl.e}`)) continue;
          const ov = overlap(x, sl);
          if (ov > bestOv) { best = sl; bestOv = ov; }
        }
        if (!best) continue;
        x.s = best.s;
        x.e = best.e;
        taken.add(`${best.s}-${best.e}`);
        if (x.x) { delete x.x; wasExported++; }
        changed++;
      }
      list.sort(byStart);
    }
    save();
    renderCalendar();
    renderSummary();
    const rest = fresh.length - changed;
    await ask({
      title: `${plural(changed, 'Schicht', 'Schichten')} angepasst`,
      html: (rest ? `${plural(rest, 'Schicht ließ', 'Schichten ließen')} sich keiner neuen Schicht zuordnen und ${rest === 1 ? 'bleibt' : 'bleiben'} unverändert.<br><br>` : '')
        + (wasExported ? `${wasExported === 1 ? 'Eine angepasste Schicht war' : `${wasExported} angepasste Schichten waren`} schon exportiert. Bitte die alten Termine im iOS-Kalender löschen und neu exportieren.` : 'Fertig.'),
      buttons: [{ label: 'OK', value: true, style: 'primary' }],
    });
  }
  async function planSave() {
    const dr = sheetCtx.draft;
    dr.error = validateDraft(dr);
    if (dr.error) { updatePlanControls(); return; }
    const before = mismatched();
    const snap = snapshot();
    const days = {};
    for (const k of PLAN_KEYS) days[k] = dr.days[k].map((x) => ({ s: x.s, e: x.e })).sort(byStart);
    let target;
    if (dr.idx === -1) { target = { from: dr.from, days }; data.plans.push(target); }
    else {
      target = data.plans[dr.idx];
      target.days = days;
      if (target.from !== null) target.from = dr.from;
    }
    data.plans.sort(planOrder);
    save();
    renderCalendar();
    renderSummary();
    const ctx = sheetCtx;
    ctx.draft = makeDraft(data.plans.indexOf(target));
    rerenderPlan();
    await offerAdapt(before);
    if (sheetCtx === ctx) toast('Schichtplan gespeichert.', { action: 'Rückgängig', onAction: () => restore(snap) });
  }
  async function planDelete() {
    const dr = sheetCtx.draft;
    if (dr.idx <= 0) return;
    const p = data.plans[dr.idx];
    const ok = await ask({ title: 'Planänderung löschen?', text: `Ab dem ${fmtDate(p.from)} gilt dann wieder der vorherige Plan.`, ok: 'Löschen', danger: true });
    if (!ok) return;
    const before = mismatched();
    const snap = snapshot();
    data.plans.splice(dr.idx, 1);
    save();
    const ctx = sheetCtx;
    ctx.draft = makeDraft(currentPlanIdx());
    rerenderPlan();
    renderCalendar();
    renderSummary();
    await offerAdapt(before);
    if (sheetCtx === ctx) toast('Planänderung gelöscht.', { action: 'Rückgängig', onAction: () => restore(snap) });
  }

  // ---- Grenzen ----
  function rerenderLimits() { const box = $('#limitRows'); if (box) box.innerHTML = limitRowsHTML(); }
  function commitLimit(t) {
    const y = t.dataset.year;
    const c = parseMoney(t.value);
    if (!(c > 0 && c < 1e8)) {
      t.value = fmtMoneyShort(data.limits[y]);
      toast('Bitte einen Betrag wie 603 eingeben.');
      return;
    }
    data.limits[y] = c;
    t.value = fmtMoneyShort(c);
    save();
    renderSummary();
  }
  function addLimitYear() {
    const years = Object.keys(data.limits).map(Number);
    const y = !data.limits[view.y] ? view.y : Math.max(...years) + 1;
    data.limits[y] = limitInfo(y).cents;
    save();
    rerenderLimits();
    renderSummary();
    const inp = $(`input[data-set="limit"][data-year="${y}"]`);
    if (inp) inp.focus();
  }
  function delLimitYear(y) {
    if (Object.keys(data.limits).length <= 1) return;
    delete data.limits[y];
    save();
    rerenderLimits();
    renderSummary();
  }

  function setTheme(t) {
    if (!THEMES[t]) return;
    data.ui.theme = t;
    save();
    applyTheme();
    $$('[data-act="theme"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.theme === t)));
  }

  // ---- Backup ----
  const backupJSON = () => JSON.stringify({ ...data, exportedAt: new Date().toISOString() }, null, 2);
  const backupName = () => `schichtplaner-backup-${localToday()}.json`;
  function backupSave() {
    downloadBlob(new Blob([backupJSON()], { type: 'application/json' }), backupName());
    toast('Backup erstellt. Du findest es bei den Downloads bzw. in „Dateien“.');
  }
  async function backupShare() {
    try {
      const f = new File([backupJSON()], backupName(), { type: 'application/json' });
      await navigator.share({ files: [f], title: 'Schichtplaner-Backup' });
    } catch (err) {
      if (!err || err.name !== 'AbortError') toast('Teilen klappt hier nicht. Nutze „Backup speichern“.');
    }
  }
  function importBackup(file) {
    const reader = new FileReader();
    reader.onerror = () => toast('Die Datei konnte nicht gelesen werden.');
    reader.onload = async () => {
      let incoming;
      try {
        incoming = normalize(JSON.parse(String(reader.result)));
      } catch (err) {
        await ask({
          title: 'Kein gültiges Backup',
          text: `Die Datei lässt sich nicht laden. ${err && err.message && !/JSON|token|Unexpected/i.test(err.message) ? err.message : 'Wähle eine .json-Datei, die mit „Backup speichern“ erstellt wurde.'}`,
          buttons: [{ label: 'OK', value: true, style: 'primary' }],
        });
        return;
      }
      const count = Object.values(incoming.shifts).reduce((a, l) => a + l.length, 0);
      const ok = await ask({
        title: 'Backup laden?',
        html: `Das Backup${incoming.updated ? ` vom ${fmtStamp(Date.parse(incoming.updated))}` : ''} enthält <b>${plural(count, 'Schicht', 'Schichten')}</b>. Deine aktuellen Daten auf diesem Gerät werden dadurch ersetzt.`,
        ok: 'Backup laden',
      });
      if (!ok) return;
      const snap = snapshot();
      incoming.ui.tipHome = incoming.ui.tipHome || data.ui.tipHome;
      data = incoming;
      save();
      await closeSheet(true);
      renderAll();
      toast('Backup geladen.', { action: 'Rückgängig', onAction: () => restore(snap), ms: 9000 });
    };
    reader.readAsText(file);
  }
  async function wipeAll() {
    const ok = await ask({
      title: 'Alle Daten löschen?',
      text: 'Alle Schichten, Tageseinstellungen, Stundenlöhne und Einstellungen werden gelöscht. Tipp: Vorher ein Backup speichern.',
      ok: 'Alles löschen',
      danger: true,
    });
    if (!ok) return;
    const snap = snapshot();
    const tip = data.ui.tipHome;
    data = defaultData();
    data.ui.tipHome = tip;
    save();
    await closeSheet(true);
    renderAll();
    toast('Alle Daten gelöscht.', { action: 'Rückgängig', onAction: () => restore(snap), ms: 9000 });
  }

    },
    'sheet-back': () => overviewBack(),
    'ov-goto': (t) => {
      const y = +t.dataset.key.slice(0, 4), m = +t.dataset.key.slice(5, 7);
      closeSheet(true);
      setView(y, m);
      if (t.dataset.key === today.slice(0, 7)) requestAnimationFrame(() => scrollToToday(false));
      else window.scrollTo(0, 0);
    },
    'carry-edit': () => openCarrySheet(),
    'carry-save': () => carrySave(),
    'carry-reset': () => { const key = sheetCtx.key; closeSheet(true); carryReset(key); },
    'carry-del': (t) => { carryReset(t.dataset.key); const box = $('#carryRows'); if (box) box.innerHTML = carryRowsHTML(); },
  };
  const SHEET_ACTIONS = new Set(['mp-year', 'set-mode', 'exp-which', 'exp-go', 'pe-add', 'pe-del', 'pe-save', 'pe-discard', 'pe-new', 'pe-delete', 'pe-defaults', 'carry-save', 'carry-reset', 'ov-open', 'sheet-back', 'ov-goto']);

  document.addEventListener('click', (ev) => {
    const t = ev.target.closest('[data-act]');
    if (!t || t.disabled) return;
    const act = t.dataset.act;
    const fn = ACTIONS[act];
    if (!fn) return;
    if (SHEET_ACTIONS.has(act) && !sheetCtx) return;
    ev.preventDefault();
    fn(t, ev);
  });
  document.addEventListener('input', (ev) => {
    const t = ev.target;
    if (t.dataset.pd === 's' || t.dataset.pd === 'e' || t.dataset.pd === 'from') onPlanInput(t);
    else if (t.dataset.set === 'ics-title') { data.ics.title = t.value.slice(0, 120); save(); }
    else if (t.dataset.set === 'ics-location') { data.ics.location = t.value.slice(0, 200); save(); }
  });
  document.addEventListener('change', (ev) => {
    const t = ev.target;
    if (t.id === 'wage') commitWage();
    else if (t.id === 'importFile') { const f = t.files && t.files[0]; t.value = ''; if (f) importBackup(f); }
    else if (t.id === 'dsUntil') onUntilChange(t);
    else if (t.dataset.pd === 'ver') onVersionChange(t);
    else if (t.dataset.pd) onPlanInput(t);
    else if (t.dataset.set === 'ics-alarm') { data.ics.alarm = +t.value; save(); }
    else if (t.dataset.set === 'ics-method') { data.ics.method = t.value; save(); }
    else if (t.dataset.set === 'limit') commitLimit(t);
    else if (t.dataset.set === 'carry-on') {
      data.carry.enabled = t.checked;
      save();
      renderSummary();
      const box = $('#carryRows');
      if (box) box.innerHTML = carryRowsHTML();
    }
  });
  const wageInput = $('#wage');
  wageInput.addEventListener('focus', () => setTimeout(() => { try { wageInput.select(); } catch (e) { /* ignorieren */ } }, 0));
  wageInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); wageInput.blur(); } });
  document.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, select, textarea') || sheetEl.open || askEl.open || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === 'ArrowLeft') goMonth(-1);
    else if (e.key === 'ArrowRight') goMonth(1);
    else if (e.key === 't' || e.key === 'h') goToday();
  });
  document.addEventListener('touchstart', () => {}, { passive: true }); // aktiviert :active unter iOS
  document.addEventListener('visibilitychange', () => { if (!document.hidden && localToday() !== today) { renderAll(); refreshOpenSheet(); } });
  window.addEventListener('pageshow', (e) => { if (e.persisted) { renderAll(); } });
  window.addEventListener('storage', (e) => {
    if (e.key !== STORE_KEY || !e.newValue) return;
    try { data = normalize(JSON.parse(e.newValue)); renderAll(); refreshOpenSheet(); } catch (err) { /* ignorieren */ }
  });
  const onScheme = () => { if (data.ui.theme === 'auto') applyTheme(); };
  if (DARK_MQ.addEventListener) DARK_MQ.addEventListener('change', onScheme); else if (DARK_MQ.addListener) DARK_MQ.addListener(onScheme);
  if (window.ResizeObserver) new ResizeObserver(measureBars).observe($('#sumbar'));
  window.addEventListener('resize', measureBars);
  window.addEventListener('error', (e) => { if (e && e.message) toast(`Da ist etwas schiefgelaufen: ${e.message}`); });

  // ===========================================================================
  // Start
  // ===========================================================================
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) { /* ignorieren */ }
  renderAll();
  measureBars();
  requestAnimationFrame(() => {
    measureBars();
    scrollToToday(false);
  });

  // Schnittstelle für Tests in der Browser-Konsole
  window.Schichtplaner = Object.freeze({
    version: APP_VERSION,
    easterSunday,
    holidayName,
    slotsFor: (date) => slotsFor(date).map((x) => ({ ...x })),
    earn,
    fmtHM,
    fmtDec,
    fmtEUR,
    buildICS: (items) => buildICS(items.map((i) => ({ date: i.date, sel: { id: i.id || newId(), s: i.s, e: i.e } }))),
    money: (y, m) => ({ ...monthMoney(ledger(monthKey(y, 12)), y, m) }),
    data: () => clone(data),
  });
})();

</script>
</body>
</html>

<style>
/* ==========================================================================
   Schichtplaner Kinderbetreuung – Styles
   ========================================================================== */

/* ---------- Farben & Maße ---------- */
:root {
  --bg: #EEF1F7;
  --surface: #FFFFFF;
  --surface-2: #F4F6FA;
  --surface-3: #E8ECF3;
  --line: #E1E6EF;
  --line-strong: #C7CFDC;
  --text: #1D2133;
  --muted: #5B6479;
  --ink: #1E2240;
  --on-ink: #FFFFFF;
  --ink-hover: rgba(255, 255, 255, .13);
  --accent: #D6336C;
  --accent-press: #BB2A5C;
  --on-accent: #FFFFFF;
  --accent-soft: #FCE7EF;
  --accent-line: rgba(255, 255, 255, .4);
  --sun-soft: #FFF6E1;
  --sun-tag: #FFE3A3;
  --sun-text: #774900;
  --wkend-soft: #F2F5FC;
  --wkend-text: #3B5FA2;
  --bar: #3B5FA2;
  --warn: #CC8700;
  --danger: #C53A3A;
  --danger-soft: #FCECEC;
  --stripe: rgba(30, 34, 64, .055);
  --shadow: 0 1px 2px rgba(22, 27, 52, .06), 0 6px 18px -8px rgba(22, 27, 52, .16);
  --font: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: ui-rounded, -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --appbar-h: calc(56px + var(--safe-t));
  --sumbar-h: 0px;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1221;
    --surface: #191D30;
    --surface-2: #20253A;
    --surface-3: #2A3049;
    --line: #2A3048;
    --line-strong: #3B4364;
    --text: #E9EBF4;
    --muted: #A2A9C1;
    --ink: #1A1F3D;
    --ink-hover: rgba(255, 255, 255, .1);
    --accent: #FF6F9C;
    --accent-press: #FF8DB2;
    --on-accent: #2B0716;
    --accent-soft: #3A1B2A;
    --accent-line: rgba(43, 7, 22, .3);
    --sun-soft: #2A2315;
    --sun-tag: #4A3814;
    --sun-text: #FFD285;
    --wkend-soft: #1C2239;
    --wkend-text: #9DB7EC;
    --bar: #7FA0E8;
    --warn: #F2B53A;
    --danger: #FF7B7B;
    --danger-soft: #3A1C21;
    --stripe: rgba(255, 255, 255, .045);
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px -10px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1221;
  --surface: #191D30;
  --surface-2: #20253A;
  --surface-3: #2A3049;
  --line: #2A3048;
  --line-strong: #3B4364;
  --text: #E9EBF4;
  --muted: #A2A9C1;
  --ink: #1A1F3D;
  --ink-hover: rgba(255, 255, 255, .1);
  --accent: #FF6F9C;
  --accent-press: #FF8DB2;
  --on-accent: #2B0716;
  --accent-soft: #3A1B2A;
  --accent-line: rgba(43, 7, 22, .3);
  --sun-soft: #2A2315;
  --sun-tag: #4A3814;
  --sun-text: #FFD285;
  --wkend-soft: #1C2239;
  --wkend-text: #9DB7EC;
  --bar: #7FA0E8;
  --warn: #F2B53A;
  --danger: #FF7B7B;
  --danger-soft: #3A1C21;
  --stripe: rgba(255, 255, 255, .045);
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px -10px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* ---------- Grundlagen ---------- */
*, *::before, *::after { box-sizing: border-box; }
html {
  background: var(--bg);
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  overscroll-behavior-y: none;
}
html.is-locked, html.is-locked body { overflow: hidden; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: calc(var(--sumbar-h) + 24px);
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
button:disabled { cursor: default; opacity: .45; }
:focus { outline: none; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic {
  width: 22px; height: 22px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
}
.ic-sm { width: 17px; height: 17px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- Kopfleiste ---------- */
.appbar {
  position: sticky; top: 0; z-index: 30;
  padding: var(--safe-t) max(4px, var(--safe-r)) 0 max(4px, var(--safe-l));
  background: var(--ink);
  color: var(--on-ink);
}
.appbar-inner { max-width: 1400px; height: 56px; margin: 0 auto; display: flex; align-items: center; gap: 2px; }
.icon-btn {
  width: 44px; height: 44px; flex: none; padding: 0;
  display: grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; color: inherit;
}
.icon-btn:active { background: var(--surface-3); }
.appbar .icon-btn:active, .month-btn:active, .today-btn:active { background: var(--ink-hover); }
.month-btn {
  min-width: 0; height: 44px; padding: 0 6px 0 8px;
  display: flex; align-items: center; gap: 4px;
  border: 0; border-radius: 12px; background: transparent; color: inherit;
  font: 700 17px/1 var(--font-num); letter-spacing: -.01em; white-space: nowrap;
}
.month-label { overflow: hidden; text-overflow: ellipsis; }
.m-short { display: none; }
.appbar-spacer { flex: 1 1 auto; }
.today-btn {
  height: 44px; flex: none; padding: 0 10px;
  border: 0; border-radius: 12px; background: transparent; color: inherit;
  font-weight: 600; font-size: 16px;
}
@media (hover: hover) {
  .appbar .icon-btn:hover, .month-btn:hover, .today-btn:hover { background: var(--ink-hover); }
}
@media (max-width: 599px) {
  /* Handy: Monat groß, Jahr klein darunter – so passen Heute, Übersicht und Einstellungen daneben */
  .month-label { display: grid; justify-items: start; line-height: 1.08; }
  .m-name { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .m-year { font-size: 12px; font-weight: 600; letter-spacing: .02em; opacity: .75; }
}
@media (max-width: 389px) { .month-btn .ic { display: none; } .today-btn { padding: 0 8px; } }
@media (max-width: 349px) { .m-long { display: none; } .m-short { display: inline; } }
@media (min-width: 600px) { .month-btn { font-size: 20px; } .appbar-inner { gap: 6px; } }

/* ---------- Seitenaufbau ---------- */
.layout {
  max-width: 1400px; margin: 0 auto;
  padding: 12px max(12px, var(--safe-r)) 0 max(12px, var(--safe-l));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px;
}

/* ---------- Hinweise ---------- */
.banners { display: grid; gap: 10px; }
.banner {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px 16px; border-radius: 16px;
  background: var(--surface); box-shadow: var(--shadow);
  font-size: 15px;
}
.banner > .ic { margin-top: 1px; color: var(--accent); }
.banner p { margin: 0 0 6px; }
.banner p:last-of-type { margin-bottom: 0; }
.banner-warn { background: var(--danger-soft); }
.banner-warn > .ic { color: var(--danger); }
.banner-actions { margin-top: 10px; }

/* ---------- Monatsübersicht ---------- */
.panel {
  padding: 16px; border-radius: 18px;
  background: var(--surface); box-shadow: var(--shadow);
  display: grid; gap: 16px; align-content: start;
}
.panel-stats { display: none; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stat { display: flex; flex-direction: column; min-width: 0; }
.stat b { font: 700 24px/1.15 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { color: var(--muted); font-size: 14px; }
.panel-hint {
  margin: 0; padding: 10px 14px; border-radius: 12px;
  background: var(--accent-soft); font-size: 15px;
}
.wage { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; align-content: start; gap: 4px 12px; }
.wage-label { font-weight: 600; }
.wage-box { display: flex; align-items: center; gap: 8px; }
.wage-box input {
  width: 96px; height: 44px; padding: 0 12px;
  border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface-2);
  font: 700 17px var(--font-num); font-variant-numeric: tabular-nums; text-align: right;
}
.wage-box input:focus { border-color: var(--accent); background: var(--surface); }
.wage-unit { color: var(--muted); font-size: 15px; white-space: nowrap; }
.wage .hint { grid-column: 1 / -1; }
.hint { margin: 0; color: var(--muted); font-size: 13.5px; }
.hint.is-error { color: var(--danger); font-weight: 600; }

.meter { display: grid; gap: 6px; }
.meter-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 12px; font-size: 15px; }
.meter-title { margin-right: auto; font-weight: 600; }
.meter-val { color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bar { display: block; height: 10px; overflow: hidden; border-radius: 5px; background: var(--surface-3); }
.bar-fill { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--bar); transition: width .35s ease, background-color .2s; }
.is-near .bar-fill, .is-carry .bar-fill { background: var(--warn); }
.is-over .bar-fill { background: var(--danger); }
.meter-note { margin: 0; color: var(--muted); font-size: 14px; }
.meter.is-over .meter-note { color: var(--danger); font-weight: 600; }
.meter.is-carry .meter-note { color: var(--text); }
.sb-limit.is-carry .sb-note { color: var(--text); font-weight: 600; }
.stat-pay, .carry-link { display: none; }
.has-carry .stat-pay { display: flex; }
.has-carry .carry-link { display: inline-flex; justify-self: start; margin: -4px 0 0 -10px; }
.panel-actions { display: grid; gap: 8px; }

/* ---------- Buttons & Formulare ---------- */
.btn {
  min-height: 44px; padding: 0 16px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 1.5px solid transparent; border-radius: 12px;
  font-size: 16px; font-weight: 600; line-height: 1.2; text-align: center;
}
.btn .ic { width: 20px; height: 20px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:active { background: var(--accent-press); }
.btn-ghost { background: var(--surface-2); border-color: var(--line); color: var(--text); }
.btn-ghost:active { background: var(--surface-3); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-quiet { background: transparent; color: var(--danger); }
.btn-quiet:active { background: var(--danger-soft); }
.btn-link { background: transparent; color: var(--accent); padding: 0 10px; }
.btn-link:active { background: var(--accent-soft); }
.btn-block { width: 100%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn-col { display: grid; gap: 8px; margin: 12px 0; }
@media (hover: hover) {
  .btn-primary:hover { background: var(--accent-press); }
  .btn-ghost:hover { border-color: var(--line-strong); }
}

.field { display: grid; gap: 6px; margin: 0 0 14px; font-size: 15px; font-weight: 600; }
.input, .field input, .field select {
  width: 100%; height: 44px; padding: 0 12px;
  border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface-2);
  font-size: 16px; font-weight: 400;
}
.input:focus, .field input:focus, .field select:focus { border-color: var(--accent); background: var(--surface); }
input[type="date"], input[type="time"] {
  -webkit-appearance: none; appearance: none;
  min-width: 0; min-height: 44px;
  font-variant-numeric: tabular-nums;
}
input[type="date"]::-webkit-date-and-time-value, input[type="time"]::-webkit-date-and-time-value { text-align: left; }
select.input, .field select { -webkit-appearance: none; appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 19px) 19px, calc(100% - 13px) 19px;
  background-size: 6px 6px, 6px 6px; background-repeat: no-repeat;
}

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px;
  padding: 4px; border-radius: 14px; background: var(--surface-3);
}
.seg button {
  min-height: 48px; padding: 4px 6px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  border: 0; border-radius: 11px; background: transparent; color: var(--muted);
  font-size: 15px; font-weight: 600;
}
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.seg small { font-size: 11.5px; font-weight: 500; color: var(--muted); }

/* ---------- Kalender: Liste (Handy) ---------- */
.calendar { min-width: 0; }
.grid-head { display: none; }
.week { margin: 0 0 12px; }
.week-head {
  position: sticky; top: var(--appbar-h); z-index: 6;
  display: flex; align-items: baseline; gap: 10px;
  padding: 12px 6px 7px;
  background: var(--bg); color: var(--muted); font-size: 14px;
}
.wk-kw { color: var(--text); font: 700 15px var(--font-num); }
.wk-sum { margin-left: auto; color: var(--text); font-family: var(--font-num); font-weight: 600; font-variant-numeric: tabular-nums; }
.week-days { overflow: hidden; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }

.day {
  position: relative;
  min-height: 60px; padding: 8px 10px 8px 4px;
  display: grid; grid-template-columns: 46px minmax(0, 1fr); align-items: center; column-gap: 6px;
  scroll-margin-top: calc(var(--appbar-h) + 44px);
  scroll-margin-bottom: calc(var(--sumbar-h) + 12px);
}
.day:not(.is-out) ~ .day:not(.is-out) { border-top: 1px solid var(--line); }
.day.is-out { display: none; }
.day-head {
  align-self: stretch; min-height: 44px; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 0; border-radius: 12px; background: transparent; color: var(--text);
}
button.day-head:active { background: var(--surface-3); }
.day-wd { color: var(--muted); font-size: 12.5px; font-weight: 600; line-height: 1; }
.day-num {
  width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%;
  font: 700 19px/1 var(--font-num); font-variant-numeric: tabular-nums;
}
.day-body { min-width: 0; display: grid; gap: 6px; }
.day-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag {
  max-width: 100%; display: inline-block; padding: 2px 9px;
  overflow: hidden; border-radius: 999px; background: var(--surface-3); color: var(--muted);
  font-size: 12.5px; font-weight: 600; line-height: 1.5; white-space: nowrap; text-overflow: ellipsis;
}
.tag-hol { background: var(--sun-tag); color: var(--sun-text); }
.closed-note { min-height: 44px; display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 15px; font-weight: 600; }
.closed-note .ic { width: 18px; height: 18px; }

.day.is-weekend { background: var(--wkend-soft); }
.day.is-weekend .day-wd { color: var(--wkend-text); }
.day.is-holiday { background: var(--sun-soft); }
.day.is-holiday .day-wd, .day.is-holiday .day-num { color: var(--sun-text); }
.day.is-closed { background-image: repeating-linear-gradient(-45deg, var(--stripe) 0 7px, transparent 7px 14px); }
.day.is-past .day-wd, .day.is-past .day-num { opacity: .5; }
.day.is-today .day-num { background: var(--accent); color: var(--on-accent); opacity: 1; }
.day.is-today .day-wd { color: var(--accent); opacity: 1; }
.day.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 35% { box-shadow: inset 0 0 0 3px var(--accent); } 100% { box-shadow: inset 0 0 0 3px transparent; } }

/* ---------- Schicht-Chips ---------- */
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 132px), 1fr)); gap: 6px; }
.chip {
  position: relative; min-height: 44px;
  display: flex; overflow: hidden;
  border: 1.5px solid var(--line-strong); border-radius: 12px; background: var(--surface);
  font: 600 15px/1.15 var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.01em;
  container-type: inline-size;
  transition: background-color .15s, border-color .15s;
}
.chip-main {
  flex: 1 1 auto; min-width: 0; padding: 4px;
  border: 0; background: transparent; color: var(--text);
}
/* Wird es mit Kalender-Symbol zu eng, stehen Beginn und Ende untereinander */
@container (max-width: 152px) {
  .chip.is-on .chip-main > span { display: grid; justify-items: center; }
  .chip.is-on .dash { display: none; }
  .chip.is-on .t2 { font-weight: 600; opacity: .9; }
}
.chip.is-on { border-color: var(--accent); background: var(--accent); }
.chip.is-on .chip-main { color: var(--on-accent); font-weight: 700; }
.chip-exp {
  width: 44px; flex: none; padding: 0;
  display: grid; place-items: center;
  border: 0; border-left: 1.5px solid var(--accent-line); background: transparent; color: var(--on-accent);
}
.chip-exp .ic { width: 20px; height: 20px; }
.chip-main:active, .chip-exp:active { background: rgba(0, 0, 0, .08); }
.chip.is-dev { border-style: dashed; border-color: var(--warn); }
.chip.pop { animation: pop .28s ease-out; }
@keyframes pop { 0% { transform: scale(.93); } 55% { transform: scale(1.035); } 100% { transform: scale(1); } }
@media (hover: hover) {
  .chip:not(.is-on):hover { border-color: var(--accent); }
}

/* ---------- Untere Leiste (Handy) ---------- */
.sumbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  border-top: 1px solid var(--line);
  background: var(--surface);
  background: color-mix(in srgb, var(--surface) 90%, transparent);
  -webkit-backdrop-filter: saturate(1.6) blur(14px);
  backdrop-filter: saturate(1.6) blur(14px);
  box-shadow: 0 -8px 24px -16px rgba(22, 27, 52, .35);
}
.sumbar-btn {
  width: 100%; max-width: 640px; margin: 0 auto;
  padding: 9px max(16px, var(--safe-r)) calc(9px + var(--safe-b)) max(16px, var(--safe-l));
  display: block; border: 0; background: transparent; color: var(--text); text-align: left;
}
.sb-stats { display: grid; grid-template-columns: minmax(0, .8fr) minmax(0, 1.1fr) minmax(0, 1.1fr); gap: 8px; }
.sb-stat { min-width: 0; display: flex; flex-direction: column; }
.sb-stat.c2 { align-items: center; }
.sb-stat.c3 { align-items: flex-end; }
.sb-stat b { font: 700 18px/1.2 var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sb-pay { display: none; }
.has-carry .sb-stats { grid-template-columns: minmax(0, .72fr) repeat(3, minmax(0, 1fr)); gap: 6px; }
.has-carry .sb-pay { display: flex; }
.has-carry .sb-stat.c3 { align-items: center; }
.has-carry .sb-stat.c4 { align-items: flex-end; }
.has-carry .sb-stat b { font-size: clamp(14px, 4.3vw, 18px); }
.has-carry .sb-stat small { font-size: clamp(11px, 3.1vw, 12.5px); }
.sb-stat small { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.sb-limit { margin-top: 8px; display: grid; grid-template-columns: minmax(48px, 1fr) auto; align-items: center; gap: 10px; }
.sb-limit .bar { height: 6px; }
.sb-note { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.sb-limit.is-over .sb-note { color: var(--danger); font-weight: 600; }
@media (max-height: 500px) {
  .sb-limit { display: none; }
  .sumbar-btn { padding-top: 6px; padding-bottom: calc(6px + var(--safe-b)); }
}

/* ---------- Toast ---------- */
.toast {
  position: fixed; z-index: 60; left: 50%;
  bottom: calc(max(var(--sumbar-h), var(--safe-b)) + 14px);
  width: max-content; max-width: min(520px, calc(100vw - 24px));
  padding: 8px 8px 8px 16px;
  display: flex; align-items: center; gap: 4px 10px;
  border-radius: 14px; background: var(--text); color: var(--bg);
  font-size: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
  opacity: 0; visibility: hidden; transform: translate(-50%, 16px);
  transition: opacity .2s, transform .2s, visibility .2s;
}
.toast > span { padding: 6px 4px 6px 0; }
.toast.show { opacity: 1; visibility: visible; transform: translate(-50%, 0); }
.toast-btn {
  min-height: 40px; padding: 0 12px; flex: none;
  border: 0; border-radius: 10px; background: color-mix(in srgb, var(--bg) 16%, transparent); color: var(--bg);
  font-weight: 700;
}
.sheet .toast, .ask .toast { bottom: calc(var(--safe-b) + 14px); }

/* ---------- Dialoge ---------- */
dialog { padding: 0; border: 0; background: var(--surface); color: var(--text); }
dialog::backdrop { background: rgba(9, 11, 24, .5); }
.sheet {
  width: 100%; max-width: 100%;
  max-height: calc(100vh - var(--safe-t) - 24px);
  max-height: calc(100dvh - var(--safe-t) - 24px);
  margin: auto 0 0; overflow: hidden;
  border-radius: 22px 22px 0 0;
  box-shadow: 0 -10px 40px rgba(0, 0, 0, .25);
}
.sheet[open] { display: flex; flex-direction: column; animation: sheet-in .26s cubic-bezier(.2, .8, .2, 1); }
@keyframes sheet-in { from { transform: translateY(48px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head {
  flex: none; padding: 10px 8px 10px 20px;
  display: flex; align-items: center; gap: 8px;
  border-bottom: 1px solid var(--line);
}
.sheet-title { flex: 1; min-width: 0; margin: 0; font: 700 18px/1.25 var(--font-num); }
.sheet-head.has-back { padding-left: 6px; gap: 2px; }
.sheet-title:focus-visible { outline: none; }
.sheet-body {
  flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
  padding: 16px 20px calc(24px + var(--safe-b));
}
@media (min-width: 640px) {
  .sheet { max-width: 560px; margin: auto; border-radius: 22px; max-height: min(88vh, 920px); max-height: min(88dvh, 920px); }
  .sheet.is-wide { max-width: 640px; }
  .sheet-body { padding-bottom: 24px; }
}
.ask { width: min(calc(100vw - 32px), 420px); max-width: none; margin: auto; border-radius: 20px; box-shadow: 0 20px 60px rgba(0, 0, 0, .35); }
.ask[open] { animation: ask-in .18s ease-out; }
@keyframes ask-in { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
.ask-box { padding: 22px 20px 16px; }
.ask-title { margin: 0 0 8px; font: 700 19px/1.25 var(--font-num); }
.ask-text { color: var(--muted); font-size: 15.5px; }
.ask-text b { color: var(--text); }
.ask-actions { margin-top: 20px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.ask-actions.is-stack { flex-direction: column-reverse; align-items: stretch; }
dialog.is-fallback { position: fixed; inset: 0; z-index: 100; box-shadow: 0 0 0 100vmax rgba(9, 11, 24, .5); }

/* ---------- Inhalte der Dialoge ---------- */
.sh { margin: 24px 0 10px; font: 700 16px/1.3 var(--font-num); }
.sh:first-child { margin-top: 0; }
.set-sec { margin: 0 0 8px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.set-sec:last-child { border-bottom: 0; }
.set-sec .hint { margin-bottom: 12px; }
.sheet-body .hint + .hint { margin-top: 8px; }
.muted { color: var(--muted); }

/* Tag */
.ds-info { margin: 0 0 4px; color: var(--muted); font-size: 15px; }
.ds-info b { color: var(--text); }
.ds-range { margin: 6px 0 12px; }
.ds-range summary {
  min-height: 44px; display: flex; align-items: center; gap: 6px;
  color: var(--accent); font-weight: 600; cursor: pointer; list-style: none;
}
.ds-range summary::-webkit-details-marker { display: none; }
.ds-range summary .ic { transition: transform .15s; }
.ds-range[open] summary .ic { transform: rotate(90deg); }
.ds-list { display: grid; gap: 8px; }
.ds-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.ds-dur { color: var(--muted); font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Monatswahl */
.mp-year { margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 16px; }
.mp-y { min-width: 70px; text-align: center; font: 700 22px var(--font-num); }
.mp-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mp-m {
  min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 1.5px solid var(--line); border-radius: 14px; background: var(--surface-2);
}
.mp-m.is-cur { border-color: var(--accent); background: var(--accent-soft); }
.mp-name { font-weight: 700; }
.mp-m.is-now .mp-name::after {
  content: ""; width: 6px; height: 6px; margin-left: 5px;
  display: inline-block; vertical-align: middle; border-radius: 50%; background: var(--accent);
}
.mp-sub { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.mp-total { margin: 14px 0 0; color: var(--muted); font-size: 14px; text-align: center; }

/* Übersicht (nur lesen) */
.ov-intro { margin: 0 0 14px; }
.ov-empty { margin: 8px 0; color: var(--muted); font-size: 15px; }
.ov-year { margin: 0 0 22px; }
.ov-year-head { margin: 0 2px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.ov-year-head h3 { margin: 0; font: 700 20px/1.2 var(--font-num); }
.ov-year-sum { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; text-align: right; }
.ov-list { overflow: hidden; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.ov-cols, .ov-row {
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr) minmax(0, .85fr) minmax(0, 1.1fr) 14px;
  align-items: center; gap: 8px; padding: 0 10px 0 12px;
}
.ov-cols { min-height: 32px; background: var(--surface-2); color: var(--muted); font-size: 12px; font-weight: 600; }
.ov-row {
  width: 100%; min-height: 54px; padding-top: 6px; padding-bottom: 6px;
  border: 0; border-top: 1px solid var(--line); background: transparent; color: var(--text);
  font-size: 15px; text-align: left;
}
.ov-row:active { background: var(--surface-2); }
@media (hover: hover) { .ov-row:hover { background: var(--surface-2); } }
.ov-row.is-empty { color: var(--muted); }
.ov-m { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 6px; font-weight: 600; }
.ov-num { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov-e { font-weight: 600; }
.ov-e small { display: block; color: var(--muted); font-size: 11.5px; font-weight: 500; }
.ov-now, .ov-plan { padding: 0 7px; background: var(--accent-soft); color: var(--accent); font-size: 11.5px; line-height: 1.6; }
.ov-chev { width: 14px; height: 14px; color: var(--muted); }
.ov-stats { margin: 0 0 14px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 16px; }
.ov-stat span { display: block; color: var(--muted); font-size: 13px; }
.ov-stat b { font: 700 20px/1.2 var(--font-num); font-variant-numeric: tabular-nums; }
.ov-stat small { margin-left: 6px; color: var(--muted); font-size: 13px; }
.ov-money { margin: 0 0 18px; padding: 10px 14px; display: grid; gap: 6px; border-radius: 12px; background: var(--surface-2); font-size: 15px; }
.ov-money div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.ov-money b { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov-money .is-total { margin-top: 2px; padding-top: 6px; border-top: 1px solid var(--line-strong); font-weight: 700; }
.ov-table { width: 100%; border-collapse: collapse; font-size: 15px; }
.ov-table th { padding: 0 8px 6px 0; color: var(--muted); font-size: 12px; font-weight: 600; text-align: left; }
.ov-table th:last-child, .ov-table td:last-child { padding-right: 0; text-align: right; }
.ov-table tbody { border-top: 1px solid var(--line); }
.ov-table td { padding: 3px 8px 3px 0; vertical-align: top; }
.ov-table tbody tr:first-child td { padding-top: 10px; }
.ov-table tbody tr:last-child td { padding-bottom: 10px; }
.ov-day b { margin-right: 6px; font-weight: 600; }
.ov-day small { display: block; color: var(--muted); font-size: 12.5px; }
.ov-shift, .ov-hrs { font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ov-table tfoot td { padding-top: 10px; border-top: 2px solid var(--line-strong); font-weight: 700; }

/* Export */
.choice { margin: 14px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.choice button {
  min-height: 64px; padding: 10px 14px;
  display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 2px;
  border: 1.5px solid var(--line-strong); border-radius: 14px; background: var(--surface); text-align: left;
}
.choice button[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.choice b { font-size: 16px; }
.choice span { color: var(--muted); font-size: 14px; }
.sheet-actions { margin-top: 16px; display: grid; gap: 8px; }

/* Schichtplan-Editor */
.pe { margin-top: 4px; }
.pe-day { padding: 10px 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; border-top: 1px solid var(--line); }
.pe-name { font-weight: 600; }
@media (min-width: 560px) {
  .pe-day { grid-template-columns: 104px minmax(0, 1fr); gap: 8px; }
  .pe-name { padding-top: 11px; }
}
.pe-shifts { display: grid; gap: 6px; }
.pe-shift { display: flex; align-items: center; gap: 6px; }
.pe-shift .input { flex: 1 1 0; padding: 0 10px; }
.pe-dash { color: var(--muted); }
.pe-add { justify-self: start; padding: 0 8px; }
.pe-empty { padding-top: 11px; color: var(--muted); font-size: 14px; }

/* Minijob-Grenzen */
.limit-row { margin-bottom: 8px; display: grid; grid-template-columns: 56px minmax(0, 1fr) 44px; align-items: center; gap: 8px; }
.limit-year { font-weight: 700; font-family: var(--font-num); }
.money { display: flex; align-items: center; gap: 8px; }
.money .input { text-align: right; font-variant-numeric: tabular-nums; }
.carry-amt { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.carry-box { margin: 10px 0 8px; }
.carry-box .input { width: 160px; flex: none; font: 700 20px var(--font-num); }
.switch-row {
  margin: 18px 0 8px; min-height: 44px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px;
  cursor: pointer;
}
.switch-row > span { display: grid; gap: 3px; }
.switch-row .hint { font-weight: 400; }
.switch {
  -webkit-appearance: none; appearance: none;
  position: relative; width: 51px; height: 31px; margin: 0; flex: none;
  border-radius: 16px; background: var(--line-strong); cursor: pointer;
  transition: background-color .2s;
}
.switch::after {
  content: ""; position: absolute; top: 2px; left: 2px;
  width: 27px; height: 27px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .2s;
}
.switch:checked { background: var(--accent); }
.switch:checked::after { transform: translateX(20px); }
.help { margin: 0 0 12px; padding-left: 18px; color: var(--muted); font-size: 15px; }
.help li { margin: 5px 0; }

/* ---------- Monatsraster (Tablet & größer) ---------- */
@media (min-width: 768px) and (min-height: 600px) {
  body { padding-bottom: calc(24px + var(--safe-b)); }
  .sumbar { display: none; }
  .panel { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 28px; }
  .panel-stats, .panel-hint, .panel-actions { grid-column: 1 / -1; }
  .panel-stats { display: grid; }
  .has-carry .panel-stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .panel-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .wage { grid-template-columns: minmax(0, 1fr); }

  .grid-head {
    position: sticky; top: var(--appbar-h); z-index: 6;
    padding: 8px 0 6px;
    display: grid; grid-template-columns: 26px repeat(7, minmax(0, 1fr)); gap: 5px;
    background: var(--bg); color: var(--muted);
    font-size: 13px; font-weight: 600; text-align: center;
  }
  .grid-head .is-we { color: var(--wkend-text); }
  .week { margin: 0 0 5px; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 5px; }
  .week-head { position: static; padding: 12px 0 0; display: block; background: none; text-align: center; }
  .wk-label, .wk-range, .wk-sum { display: none; }
  .wk-kw { color: var(--muted); font-size: 12px; }
  .week-days {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px;
    overflow: visible; border-radius: 0; background: none; box-shadow: none;
  }
  .day {
    min-height: 150px; padding: 5px;
    display: flex; flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 6px;
    border-radius: 14px; background: var(--surface); box-shadow: var(--shadow);
  }
  .day:not(.is-out) ~ .day:not(.is-out) { border-top: 0; }
  .day.is-out { display: flex; background: transparent; box-shadow: none; }
  .day.is-out .day-num { color: var(--muted); opacity: .4; }
  .day-head { flex-direction: row; justify-content: flex-start; align-self: stretch; min-height: 36px; padding: 0 2px; }
  .day-wd { display: none; }
  .day-num { width: 32px; height: 32px; font-size: 17px; }
  .day.is-today { box-shadow: inset 0 0 0 2px var(--accent), var(--shadow); }
  .day-body { align-content: start; }
  .tag {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    padding: 3px 7px; border-radius: 8px; white-space: normal; line-height: 1.25; font-size: 12px;
  }
  .chips { grid-template-columns: minmax(0, 1fr); gap: 5px; }
  .chip { font-size: 14px; }
  .closed-note { min-height: 0; min-width: 0; padding: 4px 2px; font-size: 12.5px; }
  .closed-note .ic { display: none; }
}

@media (min-width: 1200px) and (min-height: 600px) {
  .layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; gap: 16px 20px; }
  .banners { grid-column: 1 / -1; }
  .calendar { grid-column: 1; grid-row: 2; }
  .panel {
    grid-column: 2; grid-row: 2;
    position: sticky; top: calc(var(--appbar-h) + 14px);
    grid-template-columns: minmax(0, 1fr); gap: 16px;
  }
  .panel-stats, .has-carry .panel-stats { grid-template-columns: 1fr 1fr; gap: 14px 12px; }
  .panel-actions { display: grid; }
  .wage { grid-template-columns: minmax(0, 1fr) auto; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}

/* Schichtplaner Kinderbetreuung – Vanilla JavaScript, läuft offline */
(() => {

  const STORE_KEY = 'kibe-schichtplaner';

  const WD_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

  const PLAN_KEYS = ['1', '2', '3', '4', '5', '6', '7', 'h'];
  const PLAN_LABELS = { 1: 'Montag', 2: 'Dienstag', 3: 'Mittwoch', 4: 'Donnerstag', 5: 'Freitag', 6: 'Samstag', 7: 'Sonntag', h: 'Feiertag' };
  const DEFAULT_PLAN = {
    1: [['08:15', '12:00'], ['15:00', '19:15']],
    2: [['08:15', '12:15'], ['15:45', '19:45']],
    3: [['08:15', '12:00'], ['16:45', '20:15']],
    4: [['09:00', '12:15'], ['16:15', '20:15']],
    5: [['08:30', '12:00'], ['16:00', '19:15']],
    6: [['09:15', '12:45'], ['15:45', '18:15']],
    7: [['09:30', '14:15']],
    h: [['10:00', '15:00']],
  };
  const MODES = ['normal', 'holiday', 'closed'];
  const MODE_LABELS = { normal: 'Normal', holiday: 'Feiertag', closed: 'Geschlossen' };
  const ICS_METHODS = {
    auto: 'Automatisch (empfohlen)',
    open: 'Direkt öffnen (Blob-URL)',
    data: 'Direkt öffnen (Data-URL)',
    download: 'Als .ics-Datei herunterladen',
    share: 'Über das Teilen-Menü',
  };
  const ALARMS = { 0: 'Keine', 30: '30 Minuten vorher', 60: '1 Stunde vorher' };
  const THEMES = { auto: 'Automatisch', light: 'Hell', dark: 'Dunkel' };
  const UA = navigator.userAgent || '';
  const IS_IOS = /iPad|iPhone|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
  const IS_STANDALONE = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
  const GRID_MQ = window.matchMedia('(min-width: 768px) and (min-height: 600px)');
  const DARK_MQ = window.matchMedia('(prefers-color-scheme: dark)');
  const MOTION_MQ = window.matchMedia('(prefers-reduced-motion: reduce)');

  // Europe/Berlin mit Sommer-/Winterzeit-Regel (seit 1996 gültig: letzter Sonntag im März/Oktober)
  const VTIMEZONE = [
    'BEGIN:VTIMEZONE',
    'TZID:Europe/Berlin',
    'X-LIC-LOCATION:Europe/Berlin',
    'BEGIN:DAYLIGHT',
    'TZNAME:CEST',
    'TZOFFSETFROM:+0100',
    'TZOFFSETTO:+0200',
    'DTSTART:19700329T020000',
    'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=-1SU',
    'END:DAYLIGHT',
    'BEGIN:STANDARD',
    'TZNAME:CET',
    'TZOFFSETFROM:+0200',
    'TZOFFSETTO:+0100',
    'DTSTART:19701025T030000',
    'RRULE:FREQ=YEARLY;BYMONTH=10;BYDAY=-1SU',
    'END:STANDARD',
    'END:VTIMEZONE',
  ];

  // ===========================================================================
  // Kleine Helfer
  // ===========================================================================
  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
  const pad2 = (n) => String(n).padStart(2, '0');
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ESC[c]);
  const icon = (name, cls = '') => `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true" focusable="false"><use href="#i-${name}"></use></svg>`;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
  const smooth = () => (MOTION_MQ.matches ? 'auto' : 'smooth');

  // ===========================================================================
  // Datum – alles über UTC-Tageszahlen, damit die Zeitumstellung keine Rolle spielt
  // ===========================================================================
  const DAY_MS = 864e5;
  const ymd = (y, m, d) => `${y}-${pad2(m)}-${pad2(d)}`;
  const parts = (s) => ({ y: +s.slice(0, 4), m: +s.slice(5, 7), d: +s.slice(8, 10) });
  const dayIndex = (s) => { const p = parts(s); return Math.round(Date.UTC(p.y, p.m - 1, p.d) / DAY_MS); };
  const fromIndex = (n) => { const t = new Date(n * DAY_MS); return ymd(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
  const addDays = (s, k) => fromIndex(dayIndex(s) + k);
  const weekday = (s) => { const w = new Date(dayIndex(s) * DAY_MS).getUTCDay(); return w === 0 ? 7 : w; }; // 1 = Mo … 7 = So
  const daysInMonth = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
  const monthKey = (y, m) => `${y}-${pad2(m)}`;
  function isoWeek(s) {
    const thu = dayIndex(s) - weekday(s) + 4;
    const ty = new Date(thu * DAY_MS).getUTCFullYear();
    return Math.floor((thu - dayIndex(ymd(ty, 1, 1))) / 7) + 1;
  }
  function localToday() { const n = new Date(); return ymd(n.getFullYear(), n.getMonth() + 1, n.getDate()); }
  function isValidDate(s) {
    if (typeof s !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
    const p = parts(s);
    return p.y >= 1970 && p.y <= 2200 && p.m >= 1 && p.m <= 12 && p.d >= 1 && p.d <= daysInMonth(p.y, p.m);
  }
  function firstOfNextMonth(s) { const p = parts(s); return p.m === 12 ? ymd(p.y + 1, 1, 1) : ymd(p.y, p.m + 1, 1); }

  // Ostersonntag (gregorianisch, Meeus/Jones/Butcher)
  function easterSunday(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100;
    const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
    const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
    const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const n = h + l - 7 * m + 114;
    return ymd(y, Math.floor(n / 31), (n % 31) + 1);
  }

  // Gesetzliche Feiertage NRW
  const holidayCache = new Map();
  function holidaysOf(y) {
    if (holidayCache.has(y)) return holidayCache.get(y);
    const map = new Map();
    const add = (date, name) => map.set(date, map.has(date) ? `${map.get(date)} / ${name}` : name);
    const e = easterSunday(y);
    add(ymd(y, 1, 1), 'Neujahr');
    add(addDays(e, -2), 'Karfreitag');
    add(addDays(e, 1), 'Ostermontag');
    add(ymd(y, 5, 1), 'Tag der Arbeit');
    add(addDays(e, 39), 'Christi Himmelfahrt');
    add(addDays(e, 50), 'Pfingstmontag');
    add(addDays(e, 60), 'Fronleichnam');
    add(ymd(y, 10, 3), 'Tag der Deutschen Einheit');
    add(ymd(y, 11, 1), 'Allerheiligen');
    add(ymd(y, 12, 25), '1. Weihnachtstag');
    add(ymd(y, 12, 26), '2. Weihnachtstag');
    holidayCache.set(y, map);

  // ===========================================================================

  function dayItems(date) {

    for (const it of items) {
      const m = sels.find((x) => !used.has(x) && sameTimes(x, it.slot));
      if (m) { it.sel = m; used.add(m); }
    }
    for (const it of items) {
      if (it.sel) continue;
      const m = sels.find((x) => !used.has(x) && overlap(x, it.slot) > 0);
      if (m) { it.sel = m; it.dev = true; used.add(m); }

  function wageInfo(y, m) {
    const key = monthKey(y, m);
    if (data.wages[key]) return { cents: data.wages[key], own: true, from: key };
    let best = null;
    for (const k of Object.keys(data.wages)) if (k < key && (best === null || k > best)) best = k;
    return best ? { cents: data.wages[best], own: false, from: best } : { cents: DEFAULT_WAGE, own: false, from: null };
  }
  function limitInfo(y) {
    if (data.limits[y]) return { cents: data.limits[y], year: y, own: true };
    const years = Object.keys(data.limits).map(Number).sort((a, b) => a - b);
    const prev = years.filter((k) => k < y).pop();
    const k = prev !== undefined ? prev : years[0];
    return k !== undefined ? { cents: data.limits[k], year: k, own: false } : { cents: DEFAULT_LIMITS[2026], year: null, own: false };

      for (const x of data.shifts[date]) { count++; min += dur(x); if (x.x) exported++; }

    if (!keys.length) return res;
    let k = keys.reduce((a, b) => (a < b ? a : b));

    for (let guard = 0; k <= untilKey && guard < 3000; guard++, k = nextMonthKey(k)) {
      const y = +k.slice(0, 4), m = +k.slice(5, 7);

  const encoder = new TextEncoder();

    const box = $('#banners');
    const out = [];
    if (!storageOK) {
      out.push(`<div class="banner banner-warn" role="alert">${icon('alert')}<div><p><b>Speichern ist gerade nicht möglich.</b> Der Browser blockiert den Speicher, zum Beispiel im privaten Modus. Änderungen gehen beim Schließen verloren.</p></div></div>`);
    }
    if (IS_IOS && !IS_STANDALONE && !data.ui.tipHome) {
      out.push(`<div class="banner">${icon('share')}<div>
        <p><b>Als App auf den Home-Bildschirm legen:</b> In Safari auf „Teilen“ und dann auf „Zum Home-Bildschirm“ tippen. Dann behält iOS deine Daten zuverlässig.</p>
        <p>Die App auf dem Home-Bildschirm hat einen eigenen Speicher. Trag deine Schichten am besten erst dort ein – oder übertrage sie per Backup (Einstellungen).</p>
        <div class="banner-actions"><button type="button" class="btn btn-ghost" data-act="tip-ok">Verstanden</button></div>
      </div></div>`);
    }
    box.innerHTML = out.join('');
    box.hidden = out.length === 0;
  }

  function renderCalendar() {
    const { y, m } = view;
    const first = ymd(y, m, 1);
    const last = ymd(y, m, daysInMonth(y, m));
    const frag = document.createDocumentFragment();
    const head = document.createElement('div');
    head.className = 'grid-head';
    head.setAttribute('aria-hidden', 'true');
    head.innerHTML = `<span>KW</span>${WD_SHORT.map((w, i) => `<span${i >= 5 ? ' class="is-we"' : ''}>${w}</span>`).join('')}`;
    frag.append(head);
    for (let monday = addDays(first, 1 - weekday(first)); monday <= last; monday = addDays(monday, 7)) frag.append(renderWeek(monday));
    $('#calendar').replaceChildren(frag);
  }

  function weekMinutes(days) {
    let min = 0;
    for (const d of days) for (const x of selsOf(d)) min += dur(x);
    return min;
  }
  function renderWeek(monday) {
    const days = Array.from({ length: 7 }, (_, i) => addDays(monday, i));
    const pre = monthKey(view.y, view.m);
    const inMonth = days.filter((d) => d.startsWith(pre));
    const d1 = parts(inMonth[0]).d;
    const d2 = parts(inMonth[inMonth.length - 1]).d;
    const range = d1 === d2 ? `${d1}. ${MONTHS[view.m - 1]}` : `${d1}.–${d2}. ${MONTHS[view.m - 1]}`;
    const min = weekMinutes(inMonth);
    const sec = document.createElement('section');
    sec.className = 'week';
    sec.innerHTML = `<div class="week-head"><span class="wk-kw"><span class="wk-label">KW </span>${isoWeek(monday)}</span><span class="wk-range">${range}</span><span class="wk-sum">${min ? fmtHM(min) + ' Std.' : ''}</span></div><div class="week-days"></div>`;
    const box = sec.lastElementChild;
    for (const d of days) box.append(renderDay(d, d.startsWith(pre)));
    return sec;
  }
  function refreshWeekSum(weekEl) {
    if (!weekEl) return;
    const days = $$('.day:not(.is-out)', weekEl).map((el) => el.dataset.date);
    const min = weekMinutes(days);
    $('.wk-sum', weekEl).textContent = min ? `${fmtHM(min)} Std.` : '';
  }

  function chipHTML(date, it) {
    const sh = it.sel || it.slot;
    const key = `${sh.s}-${sh.e}`;
    const time = `<span class="t1">${sh.s}</span><span class="dash">–</span><span class="t2">${sh.e}</span>`;
    if (!it.sel) {
      return `<div class="chip"><button type="button" class="chip-main" data-act="toggle" data-key="${key}" data-date="${date}" data-s="${sh.s}" data-e="${sh.e}" aria-pressed="false" aria-label="Schicht ${sh.s} bis ${sh.e} Uhr"><span>${time}</span></button></div>`;
    }
    const x = it.sel;
    const exp = !!x.x;
    const devText = it.dev ? ', Zeit weicht vom aktuellen Schichtplan ab' : '';
    return `<div class="chip is-on${exp ? ' is-exp' : ''}${it.dev ? ' is-dev' : ''}" data-id="${x.id}"${it.dev ? ' title="Gespeicherte Zeit weicht vom aktuellen Schichtplan ab"' : ''}>`
      + `<button type="button" class="chip-main" data-act="toggle" data-key="${key}" data-date="${date}" data-id="${x.id}" aria-pressed="true" aria-label="Schicht ${sh.s} bis ${sh.e} Uhr, ausgewählt${devText}"><span>${time}</span></button>`
      + `<button type="button" class="chip-exp" data-act="export-one" data-key="${key}" data-date="${date}" data-id="${x.id}" aria-label="${exp ? 'Schon in den Kalender exportiert – Optionen' : 'In den Kalender exportieren'}">${icon(exp ? 'cal-check' : 'cal-plus')}</button></div>`;
  }

  function renderDay(date, inMonth) {
    const el = document.createElement('div');
    const p = parts(date);
    const wd = weekday(date);
    el.dataset.date = date;
    if (!inMonth) {
      el.className = 'day is-out';
      el.setAttribute('aria-hidden', 'true');
      el.innerHTML = `<div class="day-head"><span class="day-num">${p.d}</span></div>`;
      return el;
    }
    const hol = holidayName(date);
    const mode = modeOf(date);
    const cls = ['day'];
    if (date === today) cls.push('is-today');
    if (date < today) cls.push('is-past');
    if (wd >= 6) cls.push('is-weekend');
    if (mode === 'holiday') cls.push('is-holiday');
    if (mode === 'closed') cls.push('is-closed');
    el.className = cls.join(' ');

    const tags = [];
    if (hol && mode !== 'normal') tags.push(`<span class="tag tag-hol" title="${esc(hol)}">${esc(hol)}</span>`);
    if (hol && mode === 'normal') tags.push(`<span class="tag" title="${esc(hol)}: normal geöffnet">${esc(hol)} (normal geöffnet)</span>`);
    if (!hol && mode === 'holiday') tags.push('<span class="tag tag-hol">Feiertagszeiten</span>');

    const items = dayItems(date);
    let body;
    if (mode === 'closed' && !items.length) body = `<div class="closed-note">${icon('closed')}Geschlossen</div>`;
    else {
      if (mode === 'closed') tags.push('<span class="tag">Geschlossen</span>');
      body = `<div class="chips">${items.map((it) => chipHTML(date, it)).join('')}</div>`;
    }
    const label = `${fmtDateLong(date)}${hol ? ', ' + hol : ''}${date === today ? ', heute' : ''}: Tag einstellen`;
    el.innerHTML = `<button type="button" class="day-head" data-act="day" data-date="${date}" aria-label="${esc(label)}"><span class="day-wd">${WD_SHORT[wd - 1]}</span><span class="day-num">${p.d}</span></button>`
      + `<div class="day-body">${tags.length ? `<div class="day-tags">${tags.join('')}</div>` : ''}${body}</div>`;
    return el;
  }

  // Nur einen Tag neu zeichnen (schneller, Fokus bleibt erhalten)
  function refreshDay(date, popId) {
    const old = $(`#calendar .day[data-date="${date}"]:not(.is-out)`);
    if (old) {
      const a = document.activeElement;
      const focus = a && old.contains(a) ? { key: a.dataset.key, act: a.dataset.act } : null;
      const fresh = renderDay(date, true);
      old.replaceWith(fresh);
      if (focus) {
        const t = $(`[data-key="${focus.key}"][data-act="${focus.act}"]`, fresh) || $(`[data-key="${focus.key}"]`, fresh);
        if (t) t.focus({ preventScroll: true });
      }
      if (popId) { const chip = $(`.chip[data-id="${popId}"]`, fresh); if (chip) chip.classList.add('pop'); }
      refreshWeekSum(fresh.closest('.week'));
    }
    if (sheetCtx && sheetCtx.type === 'day' && sheetCtx.date === date) renderDaySheet();
  }

  function bind(name, value) { $$(`[data-bind="${name}"]`).forEach((el) => { el.textContent = value; }); }

  // soft = Überschreiten ist kein Fehler, weil der Rest übertragen wird
  function renderMeter(root, { title, cur, max, note, soft = false }) {
    const pct = max > 0 ? Math.min(100, (cur / max) * 100) : 0;
    root.classList.toggle('is-over', cur > max && !soft);
    root.classList.toggle('is-carry', cur > max && soft);
    root.classList.toggle('is-near', cur <= max && pct >= 90);
    $('.meter-title', root).textContent = title;
    $('.meter-val', root).textContent = `${fmtEUR(cur)} von ${fmtLimit(max)}`;
    $('.bar-fill', root).style.width = `${pct}%`;
    const bar = $('.bar', root);
    bar.setAttribute('aria-valuenow', String(Math.round(pct)));
    bar.setAttribute('aria-valuetext', `${fmtEUR(cur)} von ${fmtLimit(max)}`);
    bar.setAttribute('aria-label', title);
    $('.meter-note', root).textContent = note;
  }

  function renderSummary() {
    const { y, m } = view;
    const st = monthStats(y, m);
    const wi = wageInfo(y, m);
    const li = limitInfo(y);
    const L = ledger(monthKey(y, 12));
    const mi = monthMoney(L, y, m);
    const carryOn = data.carry.enabled;
    const mName = `${MONTHS[m - 1]} ${y}`;
    document.documentElement.classList.toggle('has-carry', carryOn);

    bind('count', String(st.count));
    bind('countLabel', st.count === 1 ? 'Schicht' : 'Schichten');
    bind('hm', `${fmtHM(st.min)} Std.`);
    bind('dec', `${fmtDec(st.min)} h`);
    bind('eur', fmtEUR(mi.earned));
    bind('pay', fmtEUR(mi.payout));
    $('#emptyHint').hidden = st.count > 0;

    const wageEl = $('#wage');
    if (document.activeElement !== wageEl) wageEl.value = fmtMoney(wi.cents);
    const wh = $('#wageHint');
    wh.classList.remove('is-error');
    wh.textContent = wi.own
      ? `Gilt ab ${mName}. Frühere Monate bleiben unverändert.`
      : wi.from
        ? `Übernommen aus ${monthLabel(wi.from)}. Eine Änderung gilt ab ${mName}.`
        : `Eine Änderung gilt ab ${mName}, frühere Monate bleiben unverändert.`;

    // ---- Monat: Verdienst + Übertrag gegen die Grenze ----
    const limit = li.cents;
    const cur = mi.earned + mi.carryIn;
    const over = cur - limit;
    const left = minutesLeft(Math.max(0, limit - mi.carryIn), st.min, mi.wage);
    const nextName = MONTHS[m % 12];
    const fallback = li.own ? '' : li.year ? ` Für ${y} ist keine Grenze hinterlegt, verwendet wird der Wert von ${li.year}.` : '';
    let note, sbNote;
    if (!carryOn) {
      note = over > 0
        ? `Monatsgrenze um ${fmtEUR(over)} überschritten. Die Grenze gilt im Jahresdurchschnitt – behalte die Jahressumme im Blick.`
        : `Noch ${fmtHM(left)} Std. möglich (${fmtEUR(limit - cur)}).`;
      sbNote = over > 0 ? `${fmtEUR(over)} über ${fmtLimit(limit)}` : `noch ${fmtHM(left)} Std. bis ${fmtLimit(limit)}`;
    } else {
      const inTxt = mi.carryIn > 0 ? `Enthält ${fmtEUR(mi.carryIn)} Übertrag ${mi.carryInSet ? '(von Hand eingetragen)' : 'aus den Vormonaten'}. ` : '';
      if (over > 0) {
        note = `${inTxt}Ausgezahlt werden ${fmtEUR(limit)}, ${fmtEUR(over)} gehen als Übertrag in den ${nextName}.`;
        sbNote = `${fmtEUR(over)} Übertrag → ${MONTHS_SHORT[m % 12]}`;
      } else if (over === 0 && cur > 0) {
        note = `${inTxt}Die Grenze ist genau erreicht.`;
        sbNote = 'Grenze erreicht';
      } else {
        note = `${inTxt}Noch ${fmtHM(left)} Std. bis zur Grenze (${fmtEUR(limit - cur)}).`;
        sbNote = mi.carryIn > 0 ? `noch ${fmtHM(left)} Std. (inkl. Übertrag)` : `noch ${fmtHM(left)} Std. bis ${fmtLimit(limit)}`;
      }
    }
    renderMeter($('#meterMonth'), { title: `Minijob-Grenze ${MONTHS[m - 1]}`, cur, max: limit, note: note + fallback, soft: carryOn });

    // ---- Jahr ----
    const yr = yearMoney(L, y);
    const yLimit = limit * 12;
    let yNote, yCur;
    if (!carryOn) {
      yCur = yr.earned;
      const yOver = yr.earned - yLimit;
      const yLeft = wi.cents > 0 ? Math.max(0, Math.floor(((yLimit - yr.earned) * 60) / wi.cents)) : 0;
      yNote = yOver > 0
        ? `Jahresgrenze (12 × ${fmtLimit(limit)}) um ${fmtEUR(yOver)} überschritten – bitte mit dem Arbeitgeber klären.`
        : `${fmtHM(yr.min)} Std. gewählt, noch etwa ${fmtHM(yLeft)} Std. möglich. Jahresgrenze: 12 × ${fmtLimit(limit)}.`;
    } else {
      yCur = yr.payout;
      const room = yLimit - yr.earned - yr.carryInStart;
      const yLeft = wi.cents > 0 && room > 0 ? Math.floor((room * 60) / wi.cents) : 0;
      yNote = `${fmtHM(yr.min)} Std. gewählt, verdient ${fmtEUR(yr.earned)}, ausgezahlt ${fmtEUR(yr.payout)}.`
        + (yr.carryOutEnd > 0 ? ` Übertrag ins Jahr ${y + 1}: ${fmtEUR(yr.carryOutEnd)}.` : yLeft > 0 ? ` Noch etwa ${fmtHM(yLeft)} Std. ohne Übertrag möglich.` : '')
        + ` Jahresgrenze: 12 × ${fmtLimit(limit)}.`;
    }
    renderMeter($('#meterYear'), { title: `Jahr ${y}`, cur: yCur, max: yLimit, note: yNote, soft: carryOn });

    // ---- Leiste unten ----
    const sb = $('#sbLimit');
    sb.classList.toggle('is-over', over > 0 && !carryOn);
    sb.classList.toggle('is-carry', over > 0 && carryOn);
    sb.classList.toggle('is-near', over <= 0 && cur >= limit * 0.9);
    $('.bar-fill', sb).style.width = `${limit > 0 ? Math.min(100, (cur / limit) * 100) : 0}%`;
    $('.sb-note', sb).textContent = sbNote;
  }

  function renderAll() {
    today = localToday();
    applyTheme();
    renderHeader();
    renderBanners();
    renderCalendar();
    renderSummary();
  }

  function measureBars() {
    const sb = $('#sumbar');
    const h = sb && getComputedStyle(sb).display !== 'none' ? sb.offsetHeight : 0;
    document.documentElement.style.setProperty('--sumbar-h', `${h}px`);
  }

  function scrollToToday(animate) {
    const el = $(`#calendar .day[data-date="${today}"]:not(.is-out)`);
    if (!el) return;
    try { el.scrollIntoView({ block: GRID_MQ.matches ? 'nearest' : 'center', behavior: animate ? smooth() : 'auto' }); } catch (e) { el.scrollIntoView(); }
  }
  function flashToday() {
    const el = $(`#calendar .day[data-date="${today}"]:not(.is-out)`);
    if (!el) return;
    el.classList.remove('flash');
    void el.offsetWidth;
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 1500);
  }

  // ===========================================================================
  // Navigation
  // ===========================================================================
  function setView(y, m) { view = { y, m }; renderAll(); }
  function goMonth(delta) {
    let y = view.y, m = view.m + delta;
    if (m < 1) { m = 12; y--; } else if (m > 12) { m = 1; y++; }
    setView(y, m);
    window.scrollTo(0, 0);
  }
  function goToday() {
    const t = parts(localToday());
    if (view.y !== t.y || view.m !== t.m) setView(t.y, t.m);
    requestAnimationFrame(() => { scrollToToday(true); flashToday(); });
  }

  // ===========================================================================
  // Dialoge: Bottom-Sheet, Rückfrage, Toast
  // ===========================================================================
  const sheetEl = $('#sheet');
  const askEl = $('#ask');
  const HAS_DIALOG = typeof sheetEl.showModal === 'function';
  function showDialog(d) { if (HAS_DIALOG) d.showModal(); else { d.setAttribute('open', ''); d.classList.add('is-fallback'); } }
  function hideDialog(d) {
    if (HAS_DIALOG) d.close();
    else { d.removeAttribute('open'); d.classList.remove('is-fallback'); d.dispatchEvent(new Event('close')); }
  }

  function setSheetBack(on) {
    $('#sheetBack').hidden = !on;
    $('.sheet-head').classList.toggle('has-back', on);
  }
  function openSheet(title, ctx) {
    sheetCtx = ctx;
    $('#sheetTitle').textContent = title;
    setSheetBack(false);
    sheetEl.classList.toggle('is-wide', ctx.type === 'settings' || ctx.type === 'overview');
    if (!sheetEl.open) {
      showDialog(sheetEl);
      document.documentElement.classList.add('is-locked');
    }
    $('#sheetBody').scrollTop = 0;
    requestAnimationFrame(() => $('#sheetTitle').focus({ preventScroll: true }));
  }
  async function closeSheet(force) {
    if (!sheetEl.open) return;
    if (!force && sheetCtx && sheetCtx.beforeClose && !(await sheetCtx.beforeClose())) return;
    hideDialog(sheetEl);
  }
  sheetEl.addEventListener('close', () => {
    sheetCtx = null;
    $('#sheetBody').replaceChildren();
    document.documentElement.classList.remove('is-locked');
    const t = $('#toast');
    if (t.parentNode !== document.body) document.body.append(t);
  });
  sheetEl.addEventListener('cancel', (e) => {
    e.preventDefault();
    if (sheetCtx && sheetCtx.type === 'overview' && sheetCtx.view === 'detail') overviewBack();
    else closeSheet();
  });
  sheetEl.addEventListener('click', (e) => { if (e.target === sheetEl) closeSheet(); });
  function refreshOpenSheet() {
    if (!sheetCtx) return;
    if (sheetCtx.type === 'day') renderDaySheet();
    else if (sheetCtx.type === 'export') renderExportSheet();
    else if (sheetCtx.type === 'month') renderMonthPicker();
    else if (sheetCtx.type === 'carry') renderCarrySheet();
    else if (sheetCtx.type === 'overview') renderOverview();
    else if (sheetCtx.type === 'settings') { sheetCtx.draft = makeDraft(currentPlanIdx()); renderSettings(); }
  }

  let askResolve = null;
  let askCancelValue = false;
  function ask({ title, text = '', html = '', ok = 'OK', cancel = 'Abbrechen', danger = false, buttons = null }) {
    if (askResolve) finishAsk(askCancelValue);
    const btns = buttons || [{ label: cancel, value: false }, { label: ok, value: true, style: danger ? 'danger' : 'primary' }];
    askCancelValue = btns[0].value;
    $('#askTitle').textContent = title;
    const t = $('#askText');
    if (html) t.innerHTML = html; else t.textContent = text;
    const bar = $('#askActions');
    bar.classList.toggle('is-stack', btns.length > 2);
    bar.replaceChildren(...btns.map((b) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.className = `btn btn-${b.style || 'ghost'}`;
      el.textContent = b.label;
      el.addEventListener('click', () => finishAsk(b.value));
      return el;
    }));
    return new Promise((resolve) => {
      askResolve = resolve;
      showDialog(askEl);
      const f = danger || btns.length > 2 ? bar.firstElementChild : bar.lastElementChild;
      if (f) f.focus({ preventScroll: true });
    });
  }
  function finishAsk(value) {
    const r = askResolve;
    askResolve = null;
    if (askEl.open) hideDialog(askEl);
    if (r) r(value);
  }
  askEl.addEventListener('cancel', (e) => { e.preventDefault(); finishAsk(askCancelValue); });
  askEl.addEventListener('click', (e) => { if (e.target === askEl) finishAsk(askCancelValue); });
  askEl.addEventListener('close', () => {
    const t = $('#toast');
    if (t.parentNode === askEl) (sheetEl.open ? sheetEl : document.body).append(t);
  });

  let toastTimer = 0;
  function toast(msg, opts = {}) {
    const el = $('#toast');
    const host = askEl.open ? askEl : sheetEl.open ? sheetEl : document.body;
    if (el.parentNode !== host) host.append(el);
    el.replaceChildren();
    const span = document.createElement('span');
    span.textContent = msg;
    el.append(span);
    if (opts.action) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'toast-btn';
      b.textContent = opts.action;
      b.addEventListener('click', () => { hideToast(); opts.onAction(); });
      el.append(b);
    }
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(hideToast, opts.ms || (opts.action ? 6500 : 3800));
  }
  function hideToast() { $('#toast').classList.remove('show'); }

  // ===========================================================================
  // Aktionen: Schichten wählen, exportieren, zurücksetzen
  // ===========================================================================
  async function toggleShift(date, s, e, id) {
    if (!persistAsked) { persistAsked = true; requestPersist(); }
    if (id) {
      const x = findSel(date, id);
      if (!x) return;
      if (x.x) {
        const ok = await ask({
          title: 'Exportierte Schicht abwählen?',
          html: `Der Termin am <b>${fmtDateShort(date)}</b> von <b>${x.s} bis ${x.e} Uhr</b> steht schon in deinem Kalender. Bitte lösche ihn dort von Hand – das kann die App nicht.`,
          ok: 'Abwählen',
          danger: true,
        });
        if (!ok) return;
      }
      removeSel(date, id);
      save();
      refreshDay(date);
      renderSummary();
      if (x.x) toast('Abgewählt. Den Kalendertermin bitte von Hand löschen.');
    } else {
      if (!isTime(s) || !isTime(e)) return;
      const sh = addSel(date, s, e);
      save();
      refreshDay(date, sh && sh.id);
      renderSummary();
    }
  }

  async function exportOne(date, id) {
    const x = findSel(date, id);
    if (!x) return;
    if (x.x) {
      const choice = await ask({
        title: 'Schon exportiert',
        html: `Die Schicht am <b>${fmtDateShort(date)}</b> (${x.s}–${x.e} Uhr) wurde am ${fmtStamp(x.x)} exportiert. Ein erneuter Export kann einen doppelten Termin anlegen.`,
        buttons: [
          { label: 'Abbrechen', value: null },
          { label: 'Als nicht exportiert markieren', value: 'unmark', style: 'ghost' },
          { label: 'Nochmal exportieren', value: 'again', style: 'primary' },
        ],
      });
      if (choice === 'unmark') {
        delete x.x;
        save();
        refreshDay(date);
        toast('Markierung entfernt.');
        return;
      }
      if (choice !== 'again') return;
    }
    const prev = x.x;
    x.x = Date.now();
    save();
    refreshDay(date);
    const ok = await deliverICS(buildICS([{ date, sel: x }]), `${fileBase()}_${date}_${x.s.replace(':', '')}.ics`);
    if (!ok) {
      if (prev) x.x = prev; else delete x.x;
      save();
      refreshDay(date);
      return;
    }
    toast('Termin an den Kalender übergeben.');
  }

  function openExportSheet() {
    const items = monthItems(view.y, view.m);
    if (!items.length) { toast('In diesem Monat ist noch keine Schicht ausgewählt.'); return; }
    const fresh = items.filter((i) => !i.sel.x).length;
    openSheet('Ganzen Monat exportieren', { type: 'export', which: fresh ? 'new' : 'all' });
    renderExportSheet();
  }
  function renderExportSheet() {
    const items = monthItems(view.y, view.m);
    const fresh = items.filter((i) => !i.sel.x).length;
    if (!fresh && sheetCtx.which === 'new') sheetCtx.which = 'all';
    const which = sheetCtx.which;
    const title = (data.ics.title || '').trim() || 'Kinderbetreuung';
    const loc = (data.ics.location || '').trim();
    $('#sheetBody').innerHTML = `
      <p class="ds-info">${MONTHS[view.m - 1]} ${view.y}: <b>${plural(items.length, 'Schicht', 'Schichten')}</b> gewählt, davon <b>${items.length - fresh}</b> schon exportiert.</p>
      <div class="choice" role="radiogroup" aria-label="Welche Schichten?">
        <button type="button" role="radio" aria-checked="${which === 'new'}" data-act="exp-which" data-which="new"${fresh ? '' : ' disabled'}><b>Nur neue</b><span>${plural(fresh, 'Schicht', 'Schichten')}</span></button>
        <button type="button" role="radio" aria-checked="${which === 'all'}" data-act="exp-which" data-which="all"><b>Alle</b><span>${plural(items.length, 'Schicht', 'Schichten')}</span></button>
      </div>
      <p class="hint">Termine heißen „${esc(title)}“${loc ? ` mit Ort „${esc(loc)}“` : ''}, Erinnerung: ${ALARMS[data.ics.alarm]}. Ändern kannst du das in den Einstellungen.</p>

        <button type="button" class="btn btn-ghost btn-block" data-act="exp-go" data-method="download">${icon('download')}Als .ics-Datei herunterladen</button>
      </div>`;
  }
  async function doMonthExport(method) {
    const items = monthItems(view.y, view.m).filter((i) => sheetCtx.which === 'all' || !i.sel.x);
    if (!items.length) return;
    const prev = items.map((i) => i.sel.x);
    const now = Date.now();
    items.forEach((i) => { i.sel.x = now; });
    save();
    const ics = buildICS(items);
    closeSheet(true);
    const ok = await deliverICS(ics, `${fileBase()}_${monthKey(view.y, view.m)}.ics`, method);
    if (!ok) items.forEach((i, k) => { if (prev[k]) i.sel.x = prev[k]; else delete i.sel.x; });
    save();
    renderCalendar();
    renderSummary();
    if (ok) toast(`${plural(items.length, 'Schicht', 'Schichten')} an den Kalender übergeben.`);
  }

  async function resetMonth() {
    const items = monthItems(view.y, view.m);
    if (!items.length) { toast('In diesem Monat ist nichts ausgewählt.'); return; }
    const exp = items.filter((i) => i.sel.x).length;
    const ok = await ask({
      title: 'Auswahl zurücksetzen?',
      html: `Alle <b>${plural(items.length, 'gewählte Schicht', 'gewählten Schichten')}</b> im ${MONTHS[view.m - 1]} ${view.y} werden entfernt.`
        + (exp ? `<br><br>${exp === 1 ? 'Eine davon wurde' : `${exp} davon wurden`} schon exportiert. Diese Termine bitte im iOS-Kalender von Hand löschen.` : ''),
      ok: 'Zurücksetzen',
      danger: true,
    });
    if (!ok) return;
    const snap = snapshot();
    const pre = monthKey(view.y, view.m) + '-';
    for (const d of Object.keys(data.shifts)) if (d.startsWith(pre)) delete data.shifts[d];
    save();
    renderCalendar();
    renderSummary();
    toast('Auswahl zurückgesetzt.', { action: 'Rückgängig', onAction: () => restore(snap) });
  }

  // ---- Lohn ----
  function commitWage() {

    if (!(cents > 0 && cents <= 50000)) {
      el.value = fmtMoney(cur.cents);

      h.textContent = 'Bitte einen Stundenlohn wie 13,90 eingeben.';
      h.classList.add('is-error');

  // ===========================================================================
  // Tag einstellen (normal / Feiertag / geschlossen)
  // ===========================================================================
  function openDaySheet(date) {
    openSheet(fmtDateLong(date), { type: 'day', date, until: date, rangeOpen: false });
    renderDaySheet();
  }
  function renderDaySheet() {
    const ctx = sheetCtx;
    const { date } = ctx;
    const hol = holidayName(date);
    const auto = autoMode(date);
    const mode = modeOf(date);
    const info = [];
    if (hol) info.push(`Feiertag in NRW: <b>${esc(hol)}</b>`);
    else if (weekday(date) >= 6) info.push('Wochenende');
    if (date === today) info.push('Heute');
    if (data.overrides[date]) info.push(`Von Hand eingestellt (automatisch wäre „${MODE_LABELS[auto]}“)`);
    const range = ctx.rangeOpen && ctx.until > date;
    const seg = MODES.map((md) => `<button type="button" data-act="set-mode" data-mode="${md}" aria-pressed="${!range && md === mode}"><span>${MODE_LABELS[md]}</span>${md === auto && !range ? '<small>automatisch</small>' : ''}</button>`).join('');
    const items = dayItems(date);
    const list = items.length
      ? items.map((it) => `<div class="ds-row">${chipHTML(date, it)}<span class="ds-dur">${fmtHM(dur(it.sel || it.slot))} Std.</span></div>`).join('')
      : `<p class="muted">${mode === 'closed' ? 'An diesem Tag ist geschlossen.' : 'Für diesen Tag sind keine Schichten geplant.'}</p>`;
    $('#sheetBody').innerHTML = `
      ${info.map((t) => `<p class="ds-info">${t}</p>`).join('')}
      <h3 class="sh" style="margin-top:16px">${range ? `Tagesart vom ${fmtDM(date)} bis ${fmtDM(ctx.until)}` : 'Tagesart'}</h3>
      <div class="seg" role="group" aria-label="Tagesart">${seg}</div>
      <details class="ds-range" id="dsRange"${ctx.rangeOpen ? ' open' : ''}>
        <summary>${icon('chev', 'ic-sm')}Für mehrere Tage festlegen</summary>
        <label class="field">Bis einschließlich<input type="date" id="dsUntil" min="${date}" max="${addDays(date, 365)}" value="${ctx.until}"></label>
        <p class="hint">Zum Beispiel für Betriebsferien: Enddatum wählen und dann oben auf die Tagesart tippen.</p>
      </details>
      <h3 class="sh">Schichten</h3>
      <div class="ds-list">${list}</div>`;
    $('#dsRange').addEventListener('toggle', (e) => {
      if (ctx.rangeOpen === e.target.open) return;
      ctx.rangeOpen = e.target.open;
      renderDaySheet();
    });
  }
  function onUntilChange(input) {
    const ctx = sheetCtx;
    if (!ctx || ctx.type !== 'day') return;
    let v = input.value;
    if (!isValidDate(v) || v < ctx.date) v = ctx.date;
    if (v > addDays(ctx.date, 365)) v = addDays(ctx.date, 365);
    ctx.until = v;
    renderDaySheet();
  }
  async function applyMode(mode) {
    const ctx = sheetCtx;
    if (!ctx || ctx.type !== 'day' || !MODES.includes(mode)) return;
    const end = ctx.rangeOpen && ctx.until > ctx.date ? ctx.until : ctx.date;
    const changed = await setDayMode(ctx.date, end, mode);
    if (changed && sheetCtx === ctx) renderDaySheet();
  }
  async function setDayMode(start, end, mode) {
    const dates = [];
    for (let n = dayIndex(start), last = dayIndex(end); n <= last && dates.length < 366; n++) dates.push(fromIndex(n));
    const changes = dates
      .map((d) => ({ d, ov: mode === autoMode(d) ? null : mode }))
      .filter(({ d, ov }) => (data.overrides[d] || null) !== ov);
    if (!changes.length) {
      if (dates.length > 1) toast(`Alle ${dates.length} Tage sind schon auf „${MODE_LABELS[mode]}“.`);
      return false;
    }
    const vanish = [];
    for (const { d, ov } of changes) {
      const slots = slotsFor(d, ov || autoMode(d));
      for (const x of selsOf(d)) if (!matchesPlan(x, slots)) vanish.push({ d, x });
    }
    if (vanish.length) {
      const exp = vanish.filter((v) => v.x.x).length;
      const shown = vanish.slice(0, 5).map((v) => `${fmtDateShort(v.d)} ${v.x.s}–${v.x.e} Uhr`).join('<br>');
      const ok = await ask({
        title: vanish.length === 1 ? 'Gewählte Schicht fällt weg' : `${vanish.length} gewählte Schichten fallen weg`,
        html: `Durch die Änderung ${vanish.length === 1 ? 'passt diese Schicht' : 'passen diese Schichten'} nicht mehr:<br><b>${shown}</b>${vanish.length > 5 ? `<br>… und ${vanish.length - 5} weitere` : ''}<br><br>Entfernen und Tagesart ändern?`
          + (exp ? `<br><br>${exp === 1 ? 'Eine davon wurde' : `${exp} davon wurden`} schon exportiert. Diese Termine bitte im iOS-Kalender von Hand löschen.` : ''),
        ok: 'Entfernen und ändern',
        danger: true,
      });
      if (!ok) return false;
    }
    const snap = snapshot();
    for (const { d, ov } of changes) { if (ov) data.overrides[d] = ov; else delete data.overrides[d]; }
    for (const { d, x } of vanish) removeSel(d, x.id);
    save();
    renderCalendar();
    renderSummary();
    toast(dates.length > 1 ? `${plural(changes.length, 'Tag', 'Tage')} auf „${MODE_LABELS[mode]}“ gestellt.` : `Tag auf „${MODE_LABELS[mode]}“ gestellt.`,
      { action: 'Rückgängig', onAction: () => restore(snap) });
    return true;
  }

  // ===========================================================================
  // Übersicht vergangener Monate (nur lesen)
  // ===========================================================================
  function openOverview() {
    openSheet('Übersicht', { type: 'overview', view: 'list', key: null, listScroll: 0 });
    renderOverview();
  }
  // Alle Monate vom ersten Monat mit Daten bis zum aktuellen Monat, neueste zuerst
  function overviewMonths() {
    const nowKey = today.slice(0, 7);
    const keys = [...minutesByMonth().keys(), ...(data.carry.enabled ? Object.keys(data.carry.set) : [])].filter((k) => k <= nowKey);
    if (!keys.length) return [];
    const out = [];
    for (let k = keys.reduce((a, b) => (a < b ? a : b)); k <= nowKey; k = nextMonthKey(k)) out.push(k);
    return out.reverse();
  }
  function renderOverview() {
    if (sheetCtx.view === 'detail') { renderOverviewDetail(); return; }
    $('#sheetTitle').textContent = 'Übersicht';
    setSheetBack(false);
    const months = overviewMonths();
    const body = $('#sheetBody');
    if (!months.length) {
      body.innerHTML = '<p class="ov-empty">Hier erscheinen deine Monate, sobald du Schichten ausgewählt hast – auch rückwirkend für vergangene Tage.</p>';
      return;
    }
    const nowKey = today.slice(0, 7);
    const L = ledger(nowKey);
    const carryOn = data.carry.enabled;
    const years = new Map();
    for (const k of months) {
      const y = +k.slice(0, 4);
      if (!years.has(y)) years.set(y, []);
      years.get(y).push(k);
    }
    let html = '<p class="hint ov-intro">Nur zum Ansehen. Tippe auf einen Monat für die einzelnen Tage und Schichten.</p>';
    for (const [y, keys] of years) {
      let min = 0, earned = 0, paid = 0;
      const rows = keys.map((k) => {
        const m = +k.slice(5, 7);
        const st = monthStats(y, m);
        const mi = monthMoney(L, y, m);
        min += mi.min; earned += mi.earned; paid += mi.payout;
        const showPay = carryOn && mi.payout !== mi.earned;
        const label = `${MONTHS[m - 1]} ${y}: ${fmtHM(mi.min)} Stunden, Stundenlohn ${fmtMoney(mi.wage)} Euro, verdient ${fmtEUR(mi.earned)}${showPay ? `, ausgezahlt ${fmtEUR(mi.payout)}` : ''}. Details anzeigen`;
        return `<button type="button" class="ov-row${st.count ? '' : ' is-empty'}" data-act="ov-open" data-key="${k}" aria-label="${esc(label)}">`
          + `<span class="ov-m">${MONTHS[m - 1]}${k === nowKey ? '<span class="tag ov-now">läuft</span>' : ''}</span>`
          + `<span class="ov-num">${fmtHM(mi.min)}</span>`
          + `<span class="ov-num">${fmtMoney(mi.wage)} €</span>`
          + `<span class="ov-num ov-e">${fmtEUR(mi.earned)}${showPay ? `<small>ausgez. ${fmtEUR(mi.payout)}</small>` : ''}</span>`
          + `${icon('right', 'ov-chev')}</button>`;
      }).join('');
      html += `<section class="ov-year">
        <div class="ov-year-head"><h3>${y}</h3><span class="ov-year-sum">${fmtHM(min)} Std., verdient ${fmtEUR(earned)}${carryOn && paid !== earned ? `<br>ausgezahlt ${fmtEUR(paid)}` : ''}</span></div>
        <div class="ov-list">
          <div class="ov-cols" aria-hidden="true"><span>Monat</span><span class="ov-num">Stunden</span><span class="ov-num">Lohn/Std.</span><span class="ov-num">Verdient</span><span></span></div>
          ${rows}
        </div>
      </section>`;
    }
    body.innerHTML = html;
  }
  function renderOverviewDetail() {
    const key = sheetCtx.key;
    const y = +key.slice(0, 4), m = +key.slice(5, 7);
    $('#sheetTitle').textContent = monthLabel(key);
    setSheetBack(true);
    const st = monthStats(y, m);
    const mi = monthMoney(ledger(key), y, m);
    const items = monthItems(y, m);
    const planned = items.filter((i) => i.date > today);
    const plannedMin = planned.reduce((a, i) => a + dur(i.sel), 0);
    const carryOn = data.carry.enabled;

    let money = `<div><span>Verdient (${fmtHM(mi.min)} Std. × ${fmtMoney(mi.wage)} €)</span><b>${fmtEUR(mi.earned)}</b></div>`;
    if (carryOn && (mi.carryIn || mi.carryOut || mi.payout !== mi.earned)) {
      if (mi.carryIn) money += `<div><span>Übertrag aus den Vormonaten${mi.carryInSet ? ' (von Hand)' : ''}</span><b>+ ${fmtEUR(mi.carryIn)}</b></div>`;
      money += `<div class="is-total"><span>Ausgezahlt (max. ${fmtLimit(mi.limit)})</span><b>${fmtEUR(mi.payout)}</b></div>`;
      if (mi.carryOut) money += `<div><span>Übertrag in den ${MONTHS[m % 12]}</span><b>${fmtEUR(mi.carryOut)}</b></div>`;
    }

    // Tabelle: eine Zeile pro Schicht, Datum nur in der ersten Zeile eines Tages
    const byDay = new Map();
    for (const it of items) { if (!byDay.has(it.date)) byDay.set(it.date, []); byDay.get(it.date).push(it.sel); }
    let rows = '';
    for (const [date, sels] of byDay) {
      const hol = holidayName(date);
      const dayMin = sels.reduce((a, x) => a + dur(x), 0);
      const notes = [];
      if (hol) notes.push(esc(hol));
      if (sels.length > 1) notes.push(`zusammen ${fmtHM(dayMin)} Std.`);
      const flag = date > today ? '<span class="tag ov-plan">geplant</span>' : date === today ? '<span class="tag ov-plan">heute</span>' : '';
      rows += '<tbody>' + sels.map((x, i) => `<tr>${i === 0 ? `<td class="ov-day" rowspan="${sels.length}"><b>${fmtDateShort(date)}</b>${flag}${notes.map((n) => `<small>${n}</small>`).join('')}</td>` : ''}`
        + `<td class="ov-shift">${x.s}–${x.e}</td><td class="ov-hrs">${fmtHM(dur(x))}</td></tr>`).join('') + '</tbody>';
    }
    const table = items.length
      ? `<table class="ov-table">
          <caption class="sr-only">Schichten im ${MONTHS[m - 1]} ${y}</caption>
          <thead><tr><th scope="col">Tag</th><th scope="col">Schicht</th><th scope="col">Std.</th></tr></thead>
          ${rows}
          <tfoot><tr><td colspan="2">${plural(st.count, 'Schicht', 'Schichten')} an ${plural(byDay.size, 'Tag', 'Tagen')}</td><td class="ov-hrs">${fmtHM(st.min)}</td></tr></tfoot>
        </table>`
      : '<p class="ov-empty">In diesem Monat wurden keine Schichten ausgewählt.</p>';

    $('#sheetBody').innerHTML = `
      <div class="ov-stats">
        <div class="ov-stat"><span>Stundenlohn</span><b>${fmtMoney(mi.wage)} €</b></div>
        <div class="ov-stat"><span>Gearbeitet</span><b>${fmtHM(mi.min)} Std.</b><small>${fmtDec(mi.min)} h</small></div>
        <div class="ov-stat"><span>Schichten</span><b>${st.count}</b></div>
        <div class="ov-stat"><span>Verdient</span><b>${fmtEUR(mi.earned)}</b></div>
      </div>
      ${planned.length ? `<p class="hint ov-intro">Der Monat läuft noch: ${plural(planned.length, 'Schicht ist', 'Schichten sind')} mit ${fmtHM(plannedMin)} Std. erst geplant und schon mitgezählt.</p>` : ''}
      <div class="ov-money">${money}</div>
      ${table}
      <div class="sheet-actions"><button type="button" class="btn btn-ghost btn-block" data-act="ov-goto" data-key="${key}">Im Kalender öffnen</button></div>`;
  }

  function planEditorHTML(dr) {

    const rows = PLAN_KEYS.map((k) => {

        + `<input type="time" class="input" data-pd="s" data-k="${k}" data-j="${j}" value="${sh.s}" aria-label="${PLAN_LABELS[k]}, ${j + 1}. Schicht, Beginn">`

  async function updatePersistInfo() {

    try {

          ? 'Der Browser hat zugesagt, die Daten dauerhaft zu behalten.'
          : 'Der Browser darf die Daten bei Speichermangel löschen – mach ab und zu ein Backup.';
      }
    } catch (e) { /* nicht verfügbar */ }
    if (IS_IOS && !IS_STANDALONE) txt += ' Als App auf dem Home-Bildschirm bleiben die Daten zuverlässiger erhalten.';
    const el = $('#persistInfo');
    if (!el) return;
